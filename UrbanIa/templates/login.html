{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="tarjeta formulario-chico">
  <h1>Iniciar sesión</h1>
  <form method="post" novalidate id="form-login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn btn-bloque" type="submit">Ingresar</button>
  </form>
  <p class="chico">¿No tiene cuenta? <a href="{{ url_for('registro') }}">Regístrese</a></p>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/validar.js') }}"></script>
{% endblock %}
